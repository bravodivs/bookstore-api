server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: pricing-service
          uri: lb://pricing-service
          predicates:
            - Path=/api/pricing/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/api/shipping/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendations/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        - id: openapi-auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/v3/api-docs/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /${segment}
        - id: openapi-catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/catalog/v3/api-docs/**
          filters:
            - RewritePath=/catalog/(?<segment>.*), /${segment}
        - id: openapi-inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/v3/api-docs/**
          filters:
            - RewritePath=/inventory/(?<segment>.*), /${segment}
        - id: openapi-pricing-service
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/v3/api-docs/**
          filters:
            - RewritePath=/pricing/(?<segment>.*), /${segment}
        - id: openapi-cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart/v3/api-docs/**
          filters:
            - RewritePath=/cart/(?<segment>.*), /${segment}
        - id: openapi-order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/v3/api-docs/**
          filters:
            - RewritePath=/orders/(?<segment>.*), /${segment}
        - id: openapi-payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/v3/api-docs/**
          filters:
            - RewritePath=/payments/(?<segment>.*), /${segment}
        - id: openapi-shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/shipping/v3/api-docs/**
          filters:
            - RewritePath=/shipping/(?<segment>.*), /${segment}
        - id: openapi-review-service
          uri: lb://review-service
          predicates:
            - Path=/reviews/v3/api-docs/**
          filters:
            - RewritePath=/reviews/(?<segment>.*), /${segment}
        - id: openapi-recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/recommendations/v3/api-docs/**
          filters:
            - RewritePath=/recommendations/(?<segment>.*), /${segment}
        - id: openapi-notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/v3/api-docs/**
          filters:
            - RewritePath=/notifications/(?<segment>.*), /${segment}
        - id: openapi-analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/analytics/v3/api-docs/**
          filters:
            - RewritePath=/analytics/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Catalog Service
        url: /catalog/v3/api-docs
      - name: Inventory Service
        url: /inventory/v3/api-docs
      - name: Pricing Service
        url: /pricing/v3/api-docs
      - name: Cart Service
        url: /cart/v3/api-docs
      - name: Order Service
        url: /orders/v3/api-docs
      - name: Payment Service
        url: /payments/v3/api-docs
      - name: Shipping Service
        url: /shipping/v3/api-docs
      - name: Review Service
        url: /reviews/v3/api-docs
      - name: Recommendation Service
        url: /recommendations/v3/api-docs
      - name: Notification Service
        url: /notifications/v3/api-docs
      - name: Analytics Service
        url: /analytics/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
